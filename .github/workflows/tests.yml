name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # All version spots must agree (CONTRIBUTING.md): a partial bump would
      # surface as a stale lockfile at release otherwise. release.yml's tag
      # guard covers pyproject.toml at tag time; this covers the other four
      # spots at PR time.
      #
      # Blocking (observation mode ended 2026-10-29, user decision): the
      # check proved itself — it caught the v0.3.2 lockfile drift and ran
      # green through the v0.4.0 bump and the follow-up PRs since.
      - name: Version consistency
        run: |
          python - <<'EOF'
          import json, re, tomllib
          lock = json.load(open("opencode/package-lock.json"))
          spots = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "plugin.yaml": re.search(r"^version:\s*(\S+)", open("plugin.yaml").read(), re.M).group(1),
              "opencode/package.json": json.load(open("opencode/package.json"))["version"],
              "lockfile (top)": lock["version"],
              "lockfile (root package)": lock["packages"][""]["version"],
          }
          versions = set(spots.values())
          assert len(versions) == 1, f"version spots disagree: {spots}"
          print("all version spots agree:", versions.pop())
          EOF
      - name: Install deps
        run: python -m pip install -q pytest "numpy>=1.26,<3"
      # Bare-environment collection: provider tests are skipped outside a
      # Hermes environment (tests/conftest.py), so this runs the core suite
      # and everything else that collects here — no file list to maintain.
      - name: Core test suite
        run: python -m pytest -q
      # Golden eval against the committed synthetic fixture (CI-safe, no live DB).
      - name: Golden eval (fixture)
        run: python eval/run_eval.py

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The OpenCode plugin must typecheck against the real @opencode/plugin
      # types — the runtime bugs found in v0.1.x were all TypeScript-side.
      - name: Install deps
        run: cd opencode && npm ci --no-audit --no-fund
      - name: Typecheck
        run: cd opencode && npm run typecheck
      # Engine-subprocess layer unit tests (fake `sh`/`cat` engines, no Python,
      # no network). Requires Node >= 22.6 for --experimental-strip-types.
      - name: Unit tests
        run: cd opencode && npm test
