name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install -q pytest "numpy>=1.26,<3"
      # Core suite only: provider tests need a Hermes environment (see CONTRIBUTING.md).
      - name: Core test suite
        run: python -m pytest -q tests/test_tiberius_store.py tests/test_tiberius_retrieval.py tests/test_tiberius_cli.py
      # Golden eval against the committed synthetic fixture (CI-safe, no live DB).
      - name: Golden eval (fixture)
        run: python eval/run_eval.py
