[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-tiberius"
version = "0.3.1"
description = "Hermes Agent memory provider plugin: tiberius"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update` (hermes-agent#113851). Keep upper bounds: Hermes pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "numpy>=1.26,<3",
]

[tool.setuptools]
# The repo root itself is the `tiberius` package (see __init__.py); map it to the
# project root so `pip install .` works regardless of the clone directory name.
packages = ["tiberius"]
package-dir = {"tiberius" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
